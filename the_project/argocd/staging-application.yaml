apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-app-staging
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Rihhard-git/kubernetes
    targetRevision: main
    path: the_project/overlays/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: project-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true