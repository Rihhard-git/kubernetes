apiVersion: batch/v1
kind: Job
metadata:
  name: backup
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: backup
            image: raihhardv/backup
            env:
              - name: URL
                valueFrom:
                  secretKeyRef:
                    name: todoapp
                    key: DATABASE_URL
          restartPolicy: Never # This time we'll run it only once