apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend
          image: PROJECT/BACKEND
          readinessProbe:
            initialDelaySeconds: 10
            periodSeconds: 5
            httpGet:
              path: /healthz
              port: 3000
          livenessProbe:
            initialDelaySeconds: 20
            periodSeconds: 10
            httpGet:
              path: /livez
              port: 3000
          resources:
            requests:
              memory: "64Mi"
              cpu: "500m"
            limits:
              memory: "128Mi"
              cpu: "750m"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: todoapp
                  key: DATABASE_URL
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: todoapp
                  key: PORT
---

apiVersion: v1
kind: Service
metadata:
  name: todo-backend-svc
spec:
  type: ClusterIP
  selector: 
    app: todo-backend
  ports:
    - port: 80
      protocol: TCP
      targetPort: 3000
