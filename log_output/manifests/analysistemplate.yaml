apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: cpu-usage
  namespace: exercises  
spec:
  metrics:
  - name: cpu-usage
    initialDelay: 5m
    successCondition: result < 0.001
    provider:
      prometheus:
        address: http://prom-prometheus-server.monitoring.svc.cluster.local:80
        query: |
          scalar(
            sum(rate(container_cpu_usage_seconds_total{namespace="exercises"}[5m]))
          )