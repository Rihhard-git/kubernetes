apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: greeter-gateway
  namespace: exercises
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"

---

apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: app-routes
  namespace: exercises
spec:
  hosts:
  - "*"
  gateways:
  - greeter-gateway
  http:
  - match:
    - uri:
        prefix: /pingpong
    rewrite:
      uri: /
    route:
      - destination:
          host: pingpong-svc
          port:
            number: 80
  - match:
    - uri:
        prefix: /greeter
    rewrite:
      uri: /
    route:
    - destination:
        host: greeter-svc-v1
        port:
          number: 80
      weight: 75
    - destination:
        host: greeter-svc-v2
        port:
          number: 80
      weight: 25
  - match:
      - uri:
          prefix: /
    route:
      - destination:
          host: log-output-svc
          port:
            number: 80
  
