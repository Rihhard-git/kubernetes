apiVersion: apps/v1
kind: Deployment
metadata:
  name: wikipedia-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wikipedia
  template:
    metadata:
      labels:
        app: wikipedia
    spec:
      volumes:
        - name: web-content
          emptyDir: {}

      initContainers:
        - name: initial-wikipedia-page
          image: curlimages/curl:8.12.1
          command:
            - sh
            - -c
            - |
              curl -L --fail --retry 3 \
                https://en.wikipedia.org/wiki/Kubernetes \
                -o /usr/share/nginx/html/index.html
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html

      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html
              readOnly: true

        - name: random-wikipedia-updater
          image: curlimages/curl:8.12.1
          command:
            - sh
            - -c
            - |
              while true; do
                delay=$((300 + RANDOM % 601))
                echo "Waiting ${delay}s"
                sleep "${delay}"

                curl -L --fail --retry 3 \
                  https://en.wikipedia.org/wiki/Special:Random \
                  -o /usr/share/nginx/html/index.html.new &&
                mv /usr/share/nginx/html/index.html.new \
                   /usr/share/nginx/html/index.html
              done
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html

---
apiVersion: v1
kind: Service
metadata:
  name: wikipedia-svc
  namespace: exercises
spec:
  type: ClusterIP
  selector:
    app: wikipedia
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80