name: Release application

on:
  delete

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: todoapp
  FE_IMAGE: todo-frontend
  BE_IMAGE: todo-backend
  BRANCH: ${{ github.ref_name }}
  AGE_KEY: ${{ secrets.AGE_KEY }}

jobs:
  build-publish-deploy:
    name: Delete environment
    runs-on: ubuntu-latest
    environment: DWK

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"
      
      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: 'Use gcloud CLI'
        run: gcloud info
      
      - run: gcloud --quiet auth configure-docker $REGISTRY

      - name: 'Get GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@v3'
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          project_id: '${{ env.PROJECT_ID }}'
          location: '${{ env.GKE_ZONE }}'
    
      - name: 'Set up Kustomize'
        uses: imranismail/setup-kustomize@v3
                   
      - name: Delete
        working-directory: ./the_project
        run: |-
          if [ "$BRANCH" = "main" ]; then
            NAMESPACE=project
          else
            NAMESPEACE=$BRANCH
          fi
          kubectl create namespace "$NAMESPACE" || true
          kubectl config set-context --current --namespace="$NAMESPACE"
          kustomize edit set namespace "$NAMESPACE"
          
          kustomize edit set image todo-frontend=$FE_IMAGE_TAG
          kustomize edit set image todo-backend=$BE_IMAGE_TAG
          kustomize build . | kubectl delete -f -
          kubectl get all -n $NAMESPACE