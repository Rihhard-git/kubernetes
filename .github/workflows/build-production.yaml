name: Build and publish Todo-App to production

on:
  push:
    tags:
    - "*"

permissions:
  contents: write

jobs:
  build-publish:
    name: Build, Push, Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # tag image with the GitHub SHA to get a unique tag
      - name: Build and publish frontend
        run: |-
          docker build --tag "raihhardv/todo-frontend:$GITHUB_SHA" ./the_project/todo-frontend
          docker push "raihhardv/todo-frontend:$GITHUB_SHA"

      - name: Build and publish backend
        run: |-
          docker build --tag "raihhardv/todo-backend:$GITHUB_SHA" ./the_project/todo-backend
          docker push "raihhardv/todo-backend:$GITHUB_SHA"  

      - name: Checkout main for production configuration update
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Set production image
        working-directory: ./the_project/overlays/production
        run: |-
            kustomize edit set image PROJECT/FRONTEND=raihhardv/todo-frontend:$GITHUB_SHA
            kustomize edit set image PROJECT/BACKEND=raihhardv/todo-backend:$GITHUB_SHA


      - name: Commit production configuration
        uses: EndBug/add-and-commit@v10
        with:
          add: 'the_project/overlays/staging/kustomization.yaml'
          message: Deploy tag ${{ github.ref_name }} to production