name: Build and publish Todo-App to production

on:
  push:
    tags:
    - "*"

permissions:
  contents: write

jobs:
  build-publish:
    name: Build, Push, Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout todo-config repo
        uses: actions/checkout@v6
        with:
          repository: Rihhard-git/todo-config
          ref: main
          path: todo-config
          token: ${{ secrets.TODO_CONFIG_TOKEN }}

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Verify both images were promoted through staging
        working-directory: ./todo-config
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |-
          FRONTEND_TAG="$(awk '
            /newName: raihhardv\/todo-frontend/ { found=1; next }
            found && /newTag:/ { print $2; exit }
          ' overlays/staging/kustomization.yaml)"

          BACKEND_TAG="$(awk '
            /newName: raihhardv\/todo-backend/ { found=1; next }
            found && /newTag:/ { print $2; exit }
          ' overlays/staging/kustomization.yaml)"

          test "$FRONTEND_TAG" = "$IMAGE_SHA" || {
            echo "Frontend image in staging is '$FRONTEND_TAG', expected '$IMAGE_SHA'"
            exit 1
          }

          test "$BACKEND_TAG" = "$IMAGE_SHA" || {
            echo "Backend image in staging is '$BACKEND_TAG', expected '$IMAGE_SHA'"
            exit 1
          }
      - name: Set production image
        working-directory: ./todo-config/overlays/production
        run: |-
            kustomize edit set image PROJECT/FRONTEND=raihhardv/todo-frontend:$GITHUB_SHA
            kustomize edit set image PROJECT/BACKEND=raihhardv/todo-backend:$GITHUB_SHA


      - name: Commit production configuration
        uses: EndBug/add-and-commit@v10
        with:
          cwd: todo-config
          add: 'overlays/production/kustomization.yaml'
          message: Deploy tag ${{ github.ref_name }} to production
          push: true
          