name: Release application

on:
  push

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: todoapp
  FE_IMAGE: todo-frontend
  BE_IMAGE: todo-backend
  BRANCH: ${{ github.ref_name }}

jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest
    environment: DWK

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"
      
      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v3'

      - name: 'Use gcloud CLI'
        run: gcloud info
      
      - run: gcloud --quiet auth configure-docker $REGISTRY

      - name: 'Get GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@v3'
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          project_id: '${{ env.PROJECT_ID }}'
          location: '${{ env.GKE_ZONE }}'
      
      - name: 'Form the FE image name'
        run: echo "FE_IMAGE_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/$FE_IMAGE:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV

      - name: 'Build Frontend'
        run: docker build --tag $FE_IMAGE_TAG ./the_project/todo-frontend

      - name: 'Publish Frontend'
        run: docker push $FE_IMAGE_TAG
      
      - name: 'Form the BE image name'
        run: echo "BE_IMAGE_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/$BE_IMAGE:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV

      - name: 'Build Backend'
        run: docker build --tag $BE_IMAGE_TAG ./the_project/todo-backend

      - name: 'Publish Backend'
        run: docker push $BE_IMAGE_TAG
    
      - name: 'Set up Kustomize'
        uses: imranismail/setup-kustomize@v3

      - name: Deploy
        run: |-
          kustomize edit set image PROJECT/IMAGE=$IMAGE_TAG
          kustomize build . | kubectl apply -f -
          kubectl rollout status deployment $SERVICE
          kubectl get services -o wide