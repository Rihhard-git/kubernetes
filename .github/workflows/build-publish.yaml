name: Build and publish application

on:
  push:

jobs:
  build-publish:
    name: Build, Push, Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # tag image with the GitHub SHA to get a unique tag
      - name: Build and publish pingpong
        run: |-
          docker build --tag "raihhardv/pingpong:$GITHUB_SHA" .
          docker push "raihhardv/pingpong:$GITHUB_SHA"

      - name: Build and publish file-reader
        run: |-
          docker build --tag "raihhardv/file-reader:$GITHUB_SHA" .
          docker push "raihhardv/file-reader:$GITHUB_SHA" 

      - name: Build and publish file-writer
        run: |-
          docker build --tag "raihhardv/file-writer:$GITHUB_SHA" .
          docker push "raihhardv/file-writer:$GITHUB_SHA" 

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use right images
        run: |-
            kustomize edit set image raihhardv/pingpong=raihhardv/pingpong:$GITHUB_SHA
            kustomize edit set image raihhardv/file-writer=raihhardv/file-writer:$GITHUB_SHA
            kustomize edit set image raihahrdv/file-reader=raihhardv/file-reader:$GITHUB_SHA

      - name: commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v10
        with:
          add: 'kustomization.yaml'
          message: New version released ${{ github.sha }}